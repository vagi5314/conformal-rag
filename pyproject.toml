[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conformal-rag"
version = "0.1.0"
description = "Production conformal RAG with FDR-guaranteed hallucination bounds"
requires-python = ">=3.10,<3.13"
license = "MIT"
dependencies = [
    "mapie>=1.0",
    "online-cp>=0.1",
    "qdrant-client>=1.7",
    "litellm>=1.30",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "transformers>=4.36",
    "torch>=2.1",
    "pydantic>=2.0",
    "httpx>=0.27",
    "sentence-transformers>=5.6.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
