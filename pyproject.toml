[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conformal-rag"
version = "0.1.0"
description = "Production conformal RAG with FDR-guaranteed hallucination bounds"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
authors = [
    { name = "Vagi S", email = "vagi5314@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Pinned: this machine's AppLocker policy denies the compiled binaries of
    # scikit-learn>1.4.2 and scipy>1.14.0 (hash block on the .pyd files).
    # TODO: remove pins once the AppLocker allowlist is updated.
    "scikit-learn==1.4.2",
    "scipy==1.14.0",
    "qdrant-client>=1.7",
    "litellm>=1.30",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "transformers>=4.36",
    "torch>=2.1",
    "pydantic>=2.0",
    "httpx>=0.27",
    "sentence-transformers>=5.6.0",
    "rank-bm25>=0.2.2",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]
benchmarks = [
    "datasets>=2.18",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/vagi5314/conformal-rag"
Repository = "https://github.com/vagi5314/conformal-rag"
Documentation = "https://github.com/vagi5314/conformal-rag#readme"
