app = "conformal-rag"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 2

[env]
  CONFORMAL_RAG_ALPHA = "0.05"
  CONFORMAL_RAG_API_HOST = "0.0.0.0"
  CONFORMAL_RAG_API_PORT = "8000"
